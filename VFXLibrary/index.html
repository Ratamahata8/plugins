<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>VFX Library</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/CSInterface.js"></script>
    <script src="js/main.js" defer></script>
  </head>
  <body>
    <header class="panel-header">
      <h1>VFX Library</h1>
      <p class="subtitle">Каталог FX прекомпов (shape + native AE)</p>
    </header>
    <section class="controls">
      <input id="search" type="search" placeholder="Search effects..." />
      <select id="category">
        <option value="all">All categories</option>
      </select>
    </section>
    <section id="grid" class="grid"></section>
    <footer class="footer">
      <span id="status">Ready.</span>
    </footer>
  </body>
</html>
